<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons must be SQUARE: a wide logo gets squashed into an illegible
         smear at 16px. Every rel="icon" here is the Ex mark WITHOUT the
         wordmark, because anything that renders small (tabs, search results)
         downscales these, and the wordmark turns to mush below ~64px.
         Google recommends a source larger than 48px, hence the 192.
         The full lockup is reserved for apple-touch-icon and the manifest,
         which are only ever shown large. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />

    <!-- Fonts: preconnect so the font CSS resolves in parallel with app CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap"
    />
    <title>BExA - Buckeye Experimental Aeronautics</title>
    <meta name="description" content="BExA is a student-led aerospace engineering program building unmanned aircraft and pushing the boundaries of high-speed flight." />

    <!-- Canonical + social tags. These are the static fallback for crawlers
         that do not run JS; useSEO() overrides them per route at runtime.
         Keep the domain in sync with SITE_URL in src/lib/constants.ts. -->
    <link rel="canonical" href="https://flybexa.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BExA - Buckeye Experimental Aeronautics" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="BExA - Buckeye Experimental Aeronautics" />
    <meta property="og:description" content="BExA is a student-led aerospace engineering program building unmanned aircraft and pushing the boundaries of high-speed flight." />
    <meta property="og:url" content="https://flybexa.com/" />
    <meta property="og:image" content="https://flybexa.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BExA - Buckeye Experimental Aeronautics" />
    <meta name="twitter:description" content="BExA is a student-led aerospace engineering program building unmanned aircraft and pushing the boundaries of high-speed flight." />
    <meta name="twitter:image" content="https://flybexa.com/og-image.jpg" />

    <!-- Organization Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Buckeye Experimental Aeronautics (BExA)",
      "description": "A student-led aerospace engineering program building unmanned aircraft and pushing the boundaries of high-speed flight.",
      "url": "https://flybexa.com",
      "email": "bexa.aero@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Columbus",
        "addressRegion": "OH",
        "addressCountry": "US"
      },
      "keywords": ["aerospace engineering", "student organization", "unmanned aircraft"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
